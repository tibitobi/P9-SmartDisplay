<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P9 Smart Display</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #070b12;
    color: white;
    font-family: Arial, sans-serif;
}

#display {
    width: 100%;
    height: 100%;
    padding: 4vh 5vw;
}

/* ZGORNJI DEL */

#top {
    height: 10%;
    position: relative;
}

#date {
    font-size: 2.2vw;
    color: #aab4c2;
}

#status {
    position: absolute;
    right: 0;
    top: 0;
    font-size: 1.2vw;
    color: #999;
}

#dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff5555;
    margin-right: 7px;
}

/* GLAVNI DEL */

#main {
    height: 60%;
    position: relative;
}

/* URA */

#clockBox {
    position: absolute;
    left: 0;
    top: 15%;
    width: 53%;
}

#clock {
    font-size: 15vw;
    line-height: 1;
    font-weight: normal;
    letter-spacing: -0.7vw;
}

#seconds {
    font-size: 2.2vw;
    color: #566273;
    margin-left: 1vw;
}

/* VREME */

#weatherBox {
    position: absolute;
    right: 0;
    top: 5%;
    width: 42%;
}

#currentWeather {
    white-space: nowrap;
}

#weatherIcon {
    display: inline-block;
    width: 30%;
    font-size: 6vw;
    vertical-align: middle;
    text-align: center;
}

#weatherData {
    display: inline-block;
    width: 65%;
    vertical-align: middle;
}

#temperature {
    font-size: 5.5vw;
}

#location {
    font-size: 1.8vw;
    margin-top: 1vh;
}

#description {
    color: #8996a8;
    font-size: 1.3vw;
    margin-top: 0.7vh;
}

/* INFO KARTICE */

#info {
    margin-top: 4vh;
    white-space: nowrap;
}

.card {
    display: inline-block;
    width: 31%;
    margin-right: 2%;
    padding: 1.5vh 0.5vw;
    text-align: center;
    background: #111822;
    border-radius: 12px;
}

.card:last-child {
    margin-right: 0;
}

.cardTitle {
    font-size: 0.8vw;
    color: #718094;
}

.cardValue {
    font-size: 1.25vw;
    margin-top: 0.7vh;
}

/* NAPOVED */

#forecast {
    height: 22%;
    white-space: nowrap;
}

.forecastCard {
    display: inline-block;
    vertical-align: top;
    width: 31.5%;
    height: 100%;
    margin-right: 2%;
    text-align: center;
    background: #0d131c;
    border-radius: 14px;
    padding-top: 2vh;
}

.forecastCard:last-child {
    margin-right: 0;
}

.forecastDay {
    color: #7d8999;
    font-size: 1vw;
}

.forecastIcon {
    font-size: 2.5vw;
    margin: 0.8vh 0;
}

.forecastTemp {
    font-size: 1.25vw;
}

/* SPODAJ */

#footer {
    height: 8%;
    position: relative;
    padding-top: 2vh;
    color: #465162;
    font-size: 0.9vw;
}

#updated {
    position: absolute;
    right: 0;
    top: 2vh;
}

/* NOČNI NAČIN */

body.night {
    background: #000000;
}

body.night #weatherBox,
body.night #forecast,
body.night #footer,
body.night #status {
    opacity: 0.15;
}

body.night #clock {
    color: #666;
}

body.night #date {
    color: #333;
}
</style>
</head>

<body>

<div id="display">

    <div id="top">
        <div id="date">Nalagam datum...</div>

        <div id="status">
            <span id="dot"></span>
            <span id="statusText">ČAKAM NA PODATKE</span>
        </div>
    </div>

    <div id="main">

        <div id="clockBox">
            <span id="clock">00:00</span>
            <span id="seconds">00</span>
        </div>

        <div id="weatherBox">

            <div id="currentWeather">

                <div id="weatherIcon">--</div>

                <div id="weatherData">
                    <div id="temperature">--°</div>
                    <div id="location">Ptuj</div>
                    <div id="description">Nalagam vreme...</div>
                </div>

            </div>

            <div id="info">

                <div class="card">
                    <div class="cardTitle">VLAGA</div>
                    <div class="cardValue" id="humidity">-- %</div>
                </div>

                <div class="card">
                    <div class="cardTitle">VETER</div>
                    <div class="cardValue" id="wind">-- km/h</div>
                </div>

                <div class="card">
                    <div class="cardTitle">DANES</div>
                    <div class="cardValue" id="minmax">--° / --°</div>
                </div>

            </div>

        </div>

    </div>

    <div id="forecast">

        <div class="forecastCard">
            <div class="forecastDay" id="day1">JUTRI</div>
            <div class="forecastIcon" id="icon1">--</div>
            <div class="forecastTemp" id="temp1">--° / --°</div>
        </div>

        <div class="forecastCard">
            <div class="forecastDay" id="day2">--</div>
            <div class="forecastIcon" id="icon2">--</div>
            <div class="forecastTemp" id="temp2">--° / --°</div>
        </div>

        <div class="forecastCard">
            <div class="forecastDay" id="day3">--</div>
            <div class="forecastIcon" id="icon3">--</div>
            <div class="forecastTemp" id="temp3">--° / --°</div>
        </div>

    </div>

    <div id="footer">
        <span>P9 SMART DISPLAY</span>
        <span id="updated">VREME: --</span>
    </div>

</div>

<script>

/*
=========================================
URA IN DATUM
=========================================
*/

var dnevi = [
    "nedelja",
    "ponedeljek",
    "torek",
    "sreda",
    "četrtek",
    "petek",
    "sobota"
];

var meseci = [
    "januar",
    "februar",
    "marec",
    "april",
    "maj",
    "junij",
    "julij",
    "avgust",
    "september",
    "oktober",
    "november",
    "december"
];

function two(n) {
    if (n < 10) {
        return "0" + n;
    }
    return "" + n;
}

function updateClock() {

    var now = new Date();

    document.getElementById("clock").innerHTML =
        two(now.getHours()) + ":" + two(now.getMinutes());

    document.getElementById("seconds").innerHTML =
        two(now.getSeconds());

    var datum =
        dnevi[now.getDay()] + ", " +
        now.getDate() + ". " +
        meseci[now.getMonth()] + " " +
        now.getFullYear();

    datum =
        datum.charAt(0).toUpperCase() +
        datum.substring(1);

    document.getElementById("date").innerHTML = datum;

    /*
    NOČNI NAČIN
    23:00 - 06:00
    */

    var hour = now.getHours();

    if (hour >= 23 || hour < 6) {
        document.body.className = "night";
    } else {
        document.body.className = "";
    }
}

updateClock();

setInterval(updateClock, 1000);


/*
=========================================
VREMENSKE IKONE
=========================================
*/

function getWeatherIcon(code) {

    code = parseInt(code, 10);

    if (code === 0) {
        return "☀";
    }

    if (code === 1) {
        return "🌤";
    }

    if (code === 2) {
        return "⛅";
    }

    if (code === 3) {
        return "☁";
    }

    if (code === 45 || code === 48) {
        return "🌫";
    }

    if (code >= 51 && code <= 57) {
        return "🌦";
    }

    if (code >= 61 && code <= 67) {
        return "🌧";
    }

    if (code >= 71 && code <= 77) {
        return "❄";
    }

    if (code >= 80 && code <= 82) {
        return "🌦";
    }

    if (code >= 85 && code <= 86) {
        return "🌨";
    }

    if (code >= 95) {
        return "⚡";
    }

    return "●";
}


/*
=========================================
DAN V TEDNU
=========================================
*/

function getDayName(dateText) {

    var parts = dateText.split("-");

    var date = new Date(
        parseInt(parts[0], 10),
        parseInt(parts[1], 10) - 1,
        parseInt(parts[2], 10)
    );

    var kratki = [
        "NED",
        "PON",
        "TOR",
        "SRE",
        "ČET",
        "PET",
        "SOB"
    ];

    return kratki[date.getDay()];
}


/*
=========================================
STATUS
=========================================
*/

function setStatus(ok) {

    var dot = document.getElementById("dot");
    var text = document.getElementById("statusText");

    if (ok) {

        dot.style.background = "#48d17d";
        dot.style.boxShadow = "0 0 10px #48d17d";

        text.innerHTML = "PODATKI OK";

    } else {

        dot.style.background = "#ff5555";
        dot.style.boxShadow = "0 0 10px #ff5555";

        text.innerHTML = "NAPAKA PODATKOV";
    }
}


/*
=========================================
PREBERI WEATHER.JSON
=========================================
*/

function loadWeather() {

    var xhr;

    if (window.XMLHttpRequest) {
        xhr = new XMLHttpRequest();
    } else {
        return;
    }

    /*
    Dodamo trenutni čas, da stari Chrome
    ne uporablja stare weather.json datoteke.
    */

    var url =
        "weather.json?t=" +
        new Date().getTime();

    xhr.open("GET", url, true);

    xhr.onreadystatechange = function() {

        if (xhr.readyState === 4) {

            if (xhr.status === 200 || xhr.status === 0) {

                try {

                    var data =
                        JSON.parse(xhr.responseText);

                    showWeather(data);

                    setStatus(true);

                } catch (e) {

                    document.getElementById("description").innerHTML =
                        "Napaka pri branju podatkov";

                    setStatus(false);
                }

            } else {

                document.getElementById("description").innerHTML =
                    "weather.json ni dosegljiv";

                setStatus(false);
            }
        }
    };

    xhr.send(null);
}


/*
=========================================
PRIKAŽI VREME
=========================================
*/

function showWeather(data) {

    document.getElementById("temperature").innerHTML =
        data.temperature + "°";

    document.getElementById("humidity").innerHTML =
        data.humidity + " %";

    document.getElementById("wind").innerHTML =
        data.wind + " km/h";

    document.getElementById("description").innerHTML =
        data.description;

    document.getElementById("weatherIcon").innerHTML =
        getWeatherIcon(data.weather_code);

    document.getElementById("minmax").innerHTML =
        data.min + "° / " + data.max + "°";

    if (data.location) {
        document.getElementById("location").innerHTML =
            data.location;
    }


    /*
    3-DNEVNA NAPOVED
    */

    if (data.forecast && data.forecast.length >= 3) {

        var i;

        for (i = 0; i < 3; i++) {

            var number = i + 1;
            var f = data.forecast[i];

            if (i === 0) {

                document.getElementById("day1").innerHTML =
                    "JUTRI";

            } else {

                document.getElementById(
                    "day" + number
                ).innerHTML =
                    getDayName(f.date);
            }

            document.getElementById(
                "icon" + number
            ).innerHTML =
                getWeatherIcon(f.code);

            document.getElementById(
                "temp" + number
            ).innerHTML =
                f.min + "° / " + f.max + "°";
        }
    }


    /*
    ČAS PODATKOV
    */

    var updatedText = data.updated;

    if (updatedText && updatedText.indexOf("T") !== -1) {

        var parts = updatedText.split("T");

        if (parts.length > 1) {
            updatedText = parts[1];
        }
    }

    document.getElementById("updated").innerHTML =
        "VREME POSODOBLJENO: " + updatedText;
}


/*
=========================================
ZAŽENI
=========================================
*/

loadWeather();

/*
Vsakih 5 minut P9 ponovno prebere weather.json.
GitHub pa vremenske podatke posodablja približno
vsakih 15 minut.
*/

setInterval(loadWeather, 5 * 60 * 1000);

</script>

</body>
</html>
