<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070b12">

<title>P9 Smart Display</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 25% 10%, #17263b 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #10243a 0%, transparent 35%),
        #070b12;
}

.dashboard {
    width: 100vw;
    height: 100vh;
    padding: 4vh 5vw;

    display: flex;
    flex-direction: column;
}

/* ZGORNJA VRSTICA */

.top {
    height: 9vh;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#date {
    font-size: 2.3vw;
    color: #aeb9c7;
}

.status {
    font-size: 1.3vw;
    color: #8995a5;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #48d17d;
    box-shadow: 0 0 10px #48d17d;
}

/* GLAVNI DEL */

.main {
    flex: 1;

    display: grid;
    grid-template-columns: 1.15fr 0.85fr;

    gap: 5vw;

    align-items: center;
}

/* URA */

.clock-area {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.clock-row {
    display: flex;
    align-items: flex-end;
}

#clock {
    font-size: 16vw;
    font-weight: 200;
    letter-spacing: -0.8vw;
    line-height: 0.9;
}

#seconds {
    font-size: 2.5vw;
    color: #5f6c7c;
    margin-left: 2vw;
    margin-bottom: 1.5vh;
}

/* VREME */

.weather {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.weather-current {
    display: flex;
    align-items: center;
    gap: 2vw;
}

#weatherIcon {
    font-size: 7vw;
}

.weather-text {
    display: flex;
    flex-direction: column;
}

#temperature {
    font-size: 6vw;
    font-weight: 300;
    line-height: 1;
}

.location {
    font-size: 2vw;
    margin-top: 1vh;
}

#description {
    font-size: 1.5vw;
    color: #8492a5;
    margin-top: 0.7vh;
}

/* PODATKI */

.info {
    margin-top: 4vh;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 1vw;
}

.card {
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.07);

    border-radius: 15px;

    padding: 1.8vh 1vw;

    text-align: center;
}

.card-title {
    color: #718094;
    font-size: 0.9vw;
}

.card-value {
    margin-top: 0.7vh;
    font-size: 1.4vw;
}

/* NAPOVED */

.forecast {
    height: 18vh;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 1.5vw;

    margin-top: 2vh;
}

.forecast-card {
    background: rgba(255,255,255,0.04);
    border-radius: 15px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 0.5vh;
}

.forecast-day {
    color: #7e8b9c;
    font-size: 1vw;
}

.forecast-icon {
    font-size: 2.2vw;
}

.forecast-temp {
    font-size: 1.25vw;
}

/* SPODNJA VRSTICA */

.footer {
    height: 6vh;

    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    color: #455163;

    font-size: 1vw;
    letter-spacing: 1px;
}

/* NOČNI NAČIN */

body.night {
    background: #000;
}

body.night .weather,
body.night .forecast,
body.night .status,
body.night .footer {
    opacity: 0.08;
}

body.night #date {
    color: #333;
}

body.night #clock {
    color: #666;
}

/* ZA MANJŠE ZASLONE */

@media (max-width: 800px) {

    #clock {
        font-size: 15vw;
    }

    .dashboard {
        padding: 3vh 4vw;
    }

}
</style>
</head>


<body>

<div class="dashboard">

    <div class="top">

        <div id="date">
            Nalagam datum...
        </div>

        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="onlineText">ONLINE</span>
        </div>

    </div>


    <div class="main">

        <!-- URA -->

        <div class="clock-area">

            <div class="clock-row">

                <div id="clock">
                    00:00
                </div>

                <div id="seconds">
                    00
                </div>

            </div>

        </div>


        <!-- VREME -->

        <div class="weather">

            <div class="weather-current">

                <div id="weatherIcon">
                    ☀️
                </div>

                <div class="weather-text">

                    <div id="temperature">
                        --°
                    </div>

                    <div class="location">
                        Ptuj
                    </div>

                    <div id="description">
                        Nalagam vreme...
                    </div>

                </div>

            </div>


            <div class="info">

                <div class="card">
                    <div class="card-title">💧 VLAGA</div>
                    <div class="card-value" id="humidity">-- %</div>
                </div>

                <div class="card">
                    <div class="card-title">🌬 VETER</div>
                    <div class="card-value" id="wind">-- km/h</div>
                </div>

                <div class="card">
                    <div class="card-title">🌡 DANES</div>
                    <div class="card-value" id="minmax">--° / --°</div>
                </div>

            </div>

        </div>

    </div>


    <!-- NAPOVED -->

    <div class="forecast">

        <div class="forecast-card">
            <div class="forecast-day">JUTRI</div>
            <div class="forecast-icon" id="icon1">☀️</div>
            <div class="forecast-temp" id="temp1">--° / --°</div>
        </div>

        <div class="forecast-card">
            <div class="forecast-day" id="day2">--</div>
            <div class="forecast-icon" id="icon2">☀️</div>
            <div class="forecast-temp" id="temp2">--° / --°</div>
        </div>

        <div class="forecast-card">
            <div class="forecast-day" id="day3">--</div>
            <div class="forecast-icon" id="icon3">☀️</div>
            <div class="forecast-temp" id="temp3">--° / --°</div>
        </div>

    </div>


    <div class="footer">

        <div>
            P9 SMART DISPLAY
        </div>

        <div id="updated">
            VREME: --
        </div>

    </div>

</div>


<script>

/* ===============================
   NASTAVITVE
================================ */

const LAT = 46.4201;
const LON = 15.8697;


/* ===============================
   URA
================================ */

function updateClock() {

    const now = new Date();

    const h =
        String(now.getHours()).padStart(2,"0");

    const m =
        String(now.getMinutes()).padStart(2,"0");

    const s =
        String(now.getSeconds()).padStart(2,"0");


    document.getElementById("clock").textContent =
        h + ":" + m;

    document.getElementById("seconds").textContent =
        s;


    const datum =
        new Intl.DateTimeFormat(
            "sl-SI",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        ).format(now);


    document.getElementById("date").textContent =
        datum.charAt(0).toUpperCase()
        + datum.slice(1);


    /* NOČNI NAČIN 23:00 - 06:00 */

    const hour = now.getHours();

    if(hour >= 23 || hour < 6) {

        document.body.classList.add("night");

    } else {

        document.body.classList.remove("night");

    }

}

updateClock();

setInterval(updateClock,1000);


/* ===============================
   VREMENSKE IKONE
================================ */

function weather(code) {

    if(code === 0)
        return ["☀️","Jasno"];

    if(code === 1)
        return ["🌤️","Pretežno jasno"];

    if(code === 2)
        return ["⛅","Delno oblačno"];

    if(code === 3)
        return ["☁️","Oblačno"];

    if(code === 45 || code === 48)
        return ["🌫️","Megla"];

    if(code >= 51 && code <= 57)
        return ["🌦️","Pršenje"];

    if(code >= 61 && code <= 67)
        return ["🌧️","Dež"];

    if(code >= 71 && code <= 77)
        return ["🌨️","Sneg"];

    if(code >= 80 && code <= 82)
        return ["🌦️","Plohe"];

    if(code >= 85 && code <= 86)
        return ["🌨️","Snežne plohe"];

    if(code >= 95)
        return ["⛈️","Nevihta"];

    return ["🌡️","Vreme"];
}


/* ===============================
   DAN V TEDNU
================================ */

function dayName(date) {

    return new Intl.DateTimeFormat(
        "sl-SI",
        {weekday:"short"}
    )

    .format(new Date(date + "T12:00:00"))

    .replace(".","")

    .toUpperCase();

}


/* ===============================
   PRENOS VREMENA
================================ */

async function getWeather() {

    const url =
    "https://api.open-meteo.com/v1/forecast" +

    "?latitude=" + LAT +

    "&longitude=" + LON +

    "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +

    "&daily=weather_code,temperature_2m_max,temperature_2m_min" +

    "&timezone=Europe%2FLjubljana" +

    "&forecast_days=4";


    try {

        const response = await fetch(url);

        if(!response.ok)
            throw new Error("Napaka API");


        const data = await response.json();

        const current = data.current;

        const w = weather(current.weather_code);


        /* TRENUTNO */

        document.getElementById("weatherIcon")
            .textContent = w[0];

        document.getElementById("description")
            .textContent = w[1];

        document.getElementById("temperature")
            .textContent =
            Math.round(current.temperature_2m) + "°";

        document.getElementById("humidity")
            .textContent =
            Math.round(current.relative_humidity_2m)
            + " %";

        document.getElementById("wind")
            .textContent =
            Math.round(current.wind_speed_10m)
            + " km/h";


        /* DANES */

        const minToday =
            Math.round(
                data.daily.temperature_2m_min[0]
            );

        const maxToday =
            Math.round(
                data.daily.temperature_2m_max[0]
            );


        document.getElementById("minmax")
            .textContent =
            minToday + "° / "
            + maxToday + "°";


        /* NAPOVED */

        for(let i=1; i<=3; i++) {

            const fw =
                weather(
                    data.daily.weather_code[i]
                );


            document.getElementById("icon"+i)
                .textContent = fw[0];


            const min =
                Math.round(
                    data.daily.temperature_2m_min[i]
                );

            const max =
                Math.round(
                    data.daily.temperature_2m_max[i]
                );


            document.getElementById("temp"+i)
                .textContent =
                min + "° / " + max + "°";


            if(i > 1) {

                document.getElementById("day"+i)
                    .textContent =
                    dayName(
                        data.daily.time[i]
                    );

            }

        }


        /* ČAS POSODOBITVE */

        const now = new Date();

        document.getElementById("updated")
            .textContent =
            "VREME POSODOBLJENO "
            +
            now.toLocaleTimeString(
                "sl-SI",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );


        setOnline(true);

    }

    catch(error) {

        console.error(error);

        document.getElementById("description")
            .textContent =
            "Vreme trenutno ni dosegljivo";

        setOnline(false);

    }

}


/* ===============================
   ONLINE / OFFLINE
================================ */

function setOnline(state) {

    const dot =
        document.getElementById("dot");

    const text =
        document.getElementById("onlineText");


    if(state) {

        dot.style.background =
            "#48d17d";

        dot.style.boxShadow =
            "0 0 10px #48d17d";

        text.textContent =
            "ONLINE";

    }

    else {

        dot.style.background =
            "#ff5555";

        dot.style.boxShadow =
            "0 0 10px #ff5555";

        text.textContent =
            "OFFLINE";

    }

}


/* PRVI PRENOS */

getWeather();


/* VREME OSVEŽI VSAKIH 15 MINUT */

setInterval(
    getWeather,
    15 * 60 * 1000
);


/* ČE SE INTERNET VRNE */

window.addEventListener(
    "online",
    getWeather
);


window.addEventListener(
    "offline",
    function() {
        setOnline(false);
    }
);

</script>

</body>
</html>
