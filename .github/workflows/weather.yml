name: Posodobi vreme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest

    steps:
      - name: Prenesi repository
        uses: actions/checkout@v4

      - name: Pridobi vreme za Ptuj
        shell: python
        run: |
          import json
          import urllib.request
          from datetime import datetime

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=46.4201"
              "&longitude=15.8697"
              "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"
              "&daily=weather_code,temperature_2m_max,temperature_2m_min"
              "&timezone=Europe%2FLjubljana"
              "&forecast_days=4"
          )

          print("Pridobivam vreme iz Open-Meteo...")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "P9-SmartDisplay/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          current = data["current"]
          daily = data["daily"]

          descriptions = {
              0: "Jasno",
              1: "Pretežno jasno",
              2: "Delno oblačno",
              3: "Oblačno",
              45: "Megla",
              48: "Megla",
              51: "Rahlo pršenje",
              53: "Pršenje",
              55: "Močno pršenje",
              56: "Ledeno pršenje",
              57: "Močno ledeno pršenje",
              61: "Rahel dež",
              63: "Dež",
              65: "Močan dež",
              66: "Leden dež",
              67: "Močan leden dež",
              71: "Rahel sneg",
              73: "Sneg",
              75: "Močan sneg",
              77: "Snežna zrna",
              80: "Rahle plohe",
              81: "Plohe",
              82: "Močne plohe",
              85: "Snežne plohe",
              86: "Močne snežne plohe",
              95: "Nevihta",
              96: "Nevihta s točo",
              99: "Močna nevihta s točo"
          }

          forecast = []

          for i in range(1, 4):
              code = daily["weather_code"][i]

              forecast.append({
                  "date": daily["time"][i],
                  "code": code,
                  "description": descriptions.get(code, "Vreme"),
                  "min": round(daily["temperature_2m_min"][i]),
                  "max": round(daily["temperature_2m_max"][i])
              })

          code = current["weather_code"]

          output = {
              "location": "Ptuj",
              "temperature": round(current["temperature_2m"]),
              "humidity": round(current["relative_humidity_2m"]),
              "wind": round(current["wind_speed_10m"]),
              "weather_code": code,
              "description": descriptions.get(code, "Vreme"),
              "min": round(daily["temperature_2m_min"][0]),
              "max": round(daily["temperature_2m_max"][0]),
              "forecast": forecast,
              "updated": current["time"]
          }

          with open("weather.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("weather.json uspešno ustvarjen.")
          print(json.dumps(output, ensure_ascii=False, indent=2))

      - name: Shrani weather.json
        run: |
          git config user.name "P9 Weather Bot"
          git config user.email "p9-weather-bot@users.noreply.github.com"

          git add weather.json

          if git diff --cached --quiet; then
            echo "Vremenski podatki se niso spremenili."
          else
            git commit -m "Posodobi vremenske podatke"
            git push
          fi
